<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gotcha! | University of Suffolk</title>
<style>
  :root {
    color-scheme: light;
    --gold: #f0c84b;
    --gold-dark: #725500;
    --charcoal: #343432;
    --ink: #292927;
    --muted: #f3f2ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #fff;
    color: var(--ink);
    font-family: Arial, Helvetica, sans-serif;
    line-height: 1.65;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    padding: 20px clamp(24px, 7vw, 96px);
    background: #fff;
    border-bottom: 1px solid #e6e4df;
  }
  .logo {
    color: var(--gold-dark);
    font-size: 1.55rem;
    font-weight: 700;
    letter-spacing: -0.04em;
  }
  .logo span { color: var(--charcoal); }
  nav { display: flex; flex-wrap: wrap; gap: 8px 28px; }
  nav a {
    padding: 8px 0;
    color: var(--charcoal);
    font-size: 0.95rem;
    font-weight: 700;
    text-decoration: none;
    border-bottom: 3px solid transparent;
  }
  nav a:hover,
  nav a:focus-visible {
    border-bottom-color: var(--gold-dark);
  }
  nav a:focus-visible,
  .cta:focus-visible,
  main a:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 4px;
  }
  .hero {
    padding: clamp(64px, 10vw, 120px) clamp(24px, 10vw, 140px);
    background: var(--charcoal);
    box-shadow: inset 0 -8px 0 var(--gold);
    color: #fff;
    text-align: left;
  }
  .hero h1 {
    max-width: 900px;
    margin: 0 auto;
    font-size: clamp(2.4rem, 6vw, 4.5rem);
    line-height: 1.1;
    letter-spacing: -0.045em;
  }
  .hero h1 em { color: var(--gold); font-style: normal; }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px 24px;
    font-size: 1.1rem;
  }
  main p { margin: 0 0 20px; }
  main a { color: var(--gold-dark); font-weight: 700; }
  .cta {
    display: inline-block;
    margin-top: 12px;
    padding: 13px 26px;
    border: 2px solid var(--charcoal);
    background: var(--charcoal);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
    transition: background-color 160ms ease, color 160ms ease;
  }
  .cta:hover {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--ink);
  }
  footer {
    margin-top: 48px;
    padding: 28px 24px;
    border-top: 6px solid var(--gold);
    background: var(--charcoal);
    color: #fff;
    font-size: 0.9rem;
    text-align: center;
  }
  @media (max-width: 600px) {
    header { align-items: flex-start; flex-direction: column; }
    nav { gap: 4px 20px; }
    .hero { padding-right: 24px; padding-left: 24px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<header>
  <div class="logo">University <span>of Suffolk</span></div>
  <nav>
    <a href="https://www.uos.ac.uk/courses">Study</a>
    <a href="https://www.uos.ac.uk/research">Research</a>
    <a href="https://www.uos.ac.uk/about">About us</a>
  </nav>
</header>
<section class="hero">
  <h1>Gotcha, you have been <em>quished!</em></h1>
</section>
<main>
  <p>Learn more about QR code phishing <a href="#">here</a>.</p>
  <p>Why not come and study with us ways to defend society from social engineering attacks like this?</p>
  <a class="cta" href="https://www.uos.ac.uk/">Study with us</a>
</main>
<footer>&copy; University of Suffolk &mdash; awareness page</footer>
</body>
</html>
